# =============================================================================
# Document RAG service
# =============================================================================

name: hermes_security_agent

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes_security_agent:0.4.0
    container_name: hermes_security_agent
    restart: unless-stopped

    env_file:
      - .env

    environment:
      APP_NAME: ${APP_NAME:-hermes_security_agent}
      APP_ENV: ${APP_ENV:-production}
      APP_HOST: 0.0.0.0
      APP_PORT: 9000
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      # Always container paths — do not inherit host-relative .env paths
      RAG_DOCS_DIR: /app/data/docs
      # Named volume (not Windows bind mount) — SQLite/Chroma stays writable
      RAG_CHROMA_ROOT: /home/appuser/.rag/chroma
      # remote = embedding-service HTTP; openai/local = in-process
      RAG_EMBED_PROVIDER: ${RAG_EMBED_PROVIDER:-remote}
      RAG_EMBED_URL: ${RAG_EMBED_URL:-http://host.docker.internal:8090}
      RAG_EMBED_BEARER_TOKEN: ${RAG_EMBED_BEARER_TOKEN:-}
      RAG_EMBED_TIMEOUT: ${RAG_EMBED_TIMEOUT:-120}
      RAG_EMBED_MODEL: ${RAG_EMBED_MODEL:-text-embedding-3-small}
      RAG_EMBED_DIM: ${RAG_EMBED_DIM:-}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-800}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-120}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_EMBED_BATCH_SIZE: ${RAG_EMBED_BATCH_SIZE:-32}
      RAG_AUTO_REINDEX_ON_MISMATCH: ${RAG_AUTO_REINDEX_ON_MISMATCH:-false}
      RAG_SYSTEM_PROMPT_PATH: ${RAG_SYSTEM_PROMPT_PATH:-/app/prompts/rag_agent_system.md}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      HEALTHCHECK_URL: http://127.0.0.1:9000/health

    ports:
      - "${APP_PORT:-9000}:9000"

    volumes:
      - ./logs:/app/logs:rw
      - ./data:/app/data:rw
      - rag_chroma:/home/appuser/.rag/chroma:rw
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro

    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    extra_hosts:
      # Docker Desktop: reach embedding-service published on host :8090
      - "host.docker.internal:host-gateway"

    security_opt:
      - no-new-privileges:true

volumes:
  rag_chroma:
    name: hermes_security_agent_rag_chroma

networks:
  default:
    name: hermes_security_agent_net
